[alembic]
# Папка с миграциями и шаблоном revision.
script_location = migrations
# `src` на PYTHONPATH, чтобы env.py мог импортировать пакет `aicore`.
prepend_sys_path = src
# Номер версии: `%04d` -> 0001, 0002, ...
file_template = %%(rev)s_%%(slug)s

# URL переопределяется в migrations/env.py из настроек приложения (db_url),
# поэтому реальное значение задавать здесь не нужно.
sqlalchemy.url = sqlite+aiosqlite:///./local.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
