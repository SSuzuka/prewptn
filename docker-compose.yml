# ============================================================================
# Инфраструктура и (опционально) приложение aicore.
#
# По умолчанию `docker compose up -d` поднимает только инфраструктуру:
#     postgres, redis, qdrant
# Сам проект умеет работать полностью in-memory:
#     broker_backend=memory, sqlite, qdrant :memory:, llm=stub
#
# Полный стек (миграции, API, worker, scheduler) — под профилем `app`:
#   docker compose --profile app up -d --build
#
# Scheduler обязателен для отложенных ретраев. `--update-interval 1` уменьшает
# квант задержки с 60 с до ~1 с; при большом числе расписаний это чаще сканирует
# Redis, поэтому интервал можно поднять.
# ============================================================================

x-app-env: &app-env
  DB_URL: postgresql+asyncpg://aicore:${POSTGRES_PASSWORD:-change-me-in-env}@postgres:5432/aicore
  BROKER_BACKEND: redis
  REDIS_URL: redis://redis:6379/0
  VECTOR_BACKEND: qdrant
  QDRANT_URL: http://qdrant:6333
  LLM_BACKEND: ${LLM_BACKEND:-stub}
  AGENT_BACKEND: ${AGENT_BACKEND:-stub}
  WORKER_METRICS_HOST: 0.0.0.0

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aicore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env}
      POSTGRES_DB: aicore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicore -d aicore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    # appendonly — иначе при рестарте теряются незавершённые задачи из Streams.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # Приложение. По умолчанию выключено: включается профилем `app`.
  # ---------------------------------------------------------------------------
  migrate:
    profiles: ["app"]
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: [".env"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build: .
    env_file: [".env"]
    environment:
      <<: *app-env
      # Fail closed: без ключа API не должен подниматься на published-порту.
      API_KEYS: ${API_KEYS:?set API_KEYS in .env}
    ports:
      # Loopback по умолчанию: наружу выставляйте осознанно, через прокси/TLS.
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build: .
    command: ["taskiq", "worker", "aicore.broker:broker", "--workers", "2"]
    env_file: [".env"]
    environment:
      <<: *app-env
      # Все worker-процессы пишут сюда; один exporter отдаёт агрегат.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    ports:
      # Один exporter на контейнер; при PROMETHEUS_MULTIPROC_DIR он отдаёт
      # агрегат по всем worker-процессам. Только loopback: аутентификации нет.
      - "127.0.0.1:9100:9100"
    # tmpfs создаётся с нужным uid/gid, поэтому не зависим от владельца volume.
    tmpfs:
      - /tmp/prometheus:uid=1000,gid=1000,mode=0755
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    profiles: ["app"]
    build: .
    command:
      - taskiq
      - scheduler
      - aicore.broker:scheduler
      - --update-interval
      - "1"
    env_file: [".env"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Фаза 2: наблюдаемость. Раскомментировать вместе с настройками в .env.
  #
  # langfuse:
  #   image: langfuse/langfuse:latest
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     DATABASE_URL: postgresql://aicore:${POSTGRES_PASSWORD:-change-me}@postgres:5432/langfuse
  #     NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-me}
  #     SALT: ${LANGFUSE_SALT:-change-me}
  #     TELEMETRY_ENABLED: "false"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #
  # prometheus:
  #   image: prom/prometheus:latest
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #
  # otel-collector:
  #   image: otel/opentelemetry-collector-contrib:latest
  #   ports:
  #     - "4317:4317"
  #     - "4318:4318"
  #   volumes:
  #     - ./deploy/otel-collector.yml:/etc/otel/config.yml:ro
  # ---------------------------------------------------------------------------

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
